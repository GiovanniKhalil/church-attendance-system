<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0815" />
      <stop offset="50%" stop-color="#4d0e23" />
      <stop offset="100%" stop-color="#19040c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0b8" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa8214" />
      <stop offset="100%" stop-color="#ffd966" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.8"/>
  <rect x="34" y="34" width="444" height="444" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4"/>

  <!-- Halo Ring -->
  <circle cx="256" cy="220" r="100" fill="none" stroke="url(#goldGrad)" stroke-width="12" opacity="0.75" filter="url(#shadow)"/>
  <circle cx="256" cy="220" r="114" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Coptic / Liturgical Cross with flared ends -->
  <g fill="url(#goldGrad)" filter="url(#shadow)">
    <!-- Vertical beam -->
    <path d="M 236 100 L 276 100 L 276 380 L 236 380 Z"/>
    <!-- Horizontal beam -->
    <path d="M 140 196 L 372 196 L 372 236 L 140 236 Z"/>
    
    <!-- Cross finials / decorative trefoils -->
    <!-- Top -->
    <path d="M 226 100 L 256 65 L 286 100 Z"/>
    <circle cx="256" cy="65" r="9"/>
    <circle cx="230" cy="98" r="7"/>
    <circle cx="282" cy="98" r="7"/>

    <!-- Bottom -->
    <path d="M 226 380 L 256 415 L 286 380 Z"/>
    <circle cx="256" cy="415" r="9"/>
    <circle cx="230" cy="382" r="7"/>
    <circle cx="282" cy="382" r="7"/>

    <!-- Left -->
    <path d="M 140 186 L 105 216 L 140 246 Z"/>
    <circle cx="105" cy="216" r="9"/>
    <circle cx="138" cy="190" r="7"/>
    <circle cx="138" cy="242" r="7"/>

    <!-- Right -->
    <path d="M 372 186 L 407 216 L 372 246 Z"/>
    <circle cx="407" cy="216" r="9"/>
    <circle cx="374" cy="190" r="7"/>
    <circle cx="374" cy="242" r="7"/>

    <!-- Center gem / emblem -->
    <circle cx="256" cy="216" r="18" fill="#2a0815" stroke="url(#goldGrad)" stroke-width="5"/>
    <circle cx="256" cy="216" r="7" fill="url(#goldGrad)"/>
  </g>

  <!-- Open Bible / Scriptural Base -->
  <g fill="url(#goldGrad)" opacity="0.9" filter="url(#shadow)">
    <path d="M 160 410 C 210 400, 245 415, 256 425 C 267 415, 302 400, 352 410 L 348 435 C 304 425, 270 435, 256 445 C 242 435, 208 425, 164 435 Z"/>
    <line x1="256" y1="425" x2="256" y2="445" stroke="#2a0815" stroke-width="3"/>
  </g>
</svg>
